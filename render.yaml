services:
  - type: web
    name: madar-marketplace
    runtime: node
    plan: free
buildCommand: npm install --include=dev && npm run build    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MADAR_SECRET
        generateValue: true
      - key: DB_PATH
        value: /tmp/madar.sqlite
